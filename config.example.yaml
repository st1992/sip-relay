  session_prefix: sip
  noise_suppression_level: ""
  time_zone: ""
  use_tool_fakes: false

websocket:
  base_url: http://127.0.0.1:8001
  session_timeout: 15s
  connect_timeout: 15s
  max_message_bytes: 4194304
  # Opt-in PCM transcoding for this backend only. Disabled by default -- audio
  # flows as raw PCMU 8kHz bytes unchanged, matching current behavior.
  transcode:
    input:                # caller -> backend (PCMU 8kHz mu-law -> PCM16LE)
      enabled: false
      sample_rate: 16000
    output:                # backend -> caller (PCM16LE -> PCMU 8kHz mu-law)
      enabled: false
      sample_rate: 24000

extensions:
  "1014":
    backend: ces
  "1015":
    backend: websocket

