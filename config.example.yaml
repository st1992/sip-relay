ces:
  project_id: div-deai-cx-dev-usc1-ri
  location: us
  app_id: 203a8f7e-7415-4d05-ac80-95617b3ad39b
  deployment_id: dea554e4-5eeb-4cd6-88e2-1b0bb27eb250
